[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # Placeholder values in docs/examples must not block deploys when they match prod env vars
  SECRETS_SCAN_OMIT_PATHS = ".env.example"
